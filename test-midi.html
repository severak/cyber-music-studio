<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test MIDI</title>
</head>
<body>
    <script>
        // this script was generated by Gemini:
        async function initMIDI() {
            // 1. Check browser support
            if (!navigator.requestMIDIAccess) {
                console.error("Web MIDI API is not supported in this browser.");
                return;
            }

            try {
                // 2. Request MIDI Access from the browser
                const midiAccess = await navigator.requestMIDIAccess();
                console.log("MIDI access granted.");

                // 3. Listen for device connection/disconnection events
                midiAccess.onstatechange = (event) => {
                    console.log(`Device state changed: ${event.port.name} is now ${event.port.state}`);
                };

                // 4. Find and open available MIDI input ports
                const inputs = midiAccess.inputs.values();
                for (let input of inputs) {
                    console.log(`Found input port: ${input.name} (ID: ${input.id})`);

                    // Explicitly open the port (returns a Promise)
                    await input.open();

                    // Listen for incoming MIDI events (Note On, Note Off, CC, etc.)
                    input.onmidimessage = handleMIDIMessage;
                }
            } catch (error) {
                console.error("Failed to access MIDI devices:", error);
            }
        }

        // 5. Callback to parse incoming MIDI event data
        function handleMIDIMessage(event) {
            // event.data is a Uint8Array representing raw MIDI bytes
            const [status, data1, data2] = event.data;
            const command = status >> 4;
            const channel = (status & 0x0f) + 1;

            switch (command) {
                case 0x9: // Note On
                    if (data2 > 0) {
                        console.log(`Note On  | Channel: ${channel} | Note: ${data1} | Velocity: ${data2}`);
                    } else {
                        // Velocity 0 is often treated as Note Off
                        console.log(`Note Off | Channel: ${channel} | Note: ${data1}`);
                    }
                    break;
                case 0x8: // Note Off
                    console.log(`Note Off | Channel: ${channel} | Note: ${data1} | Velocity: ${data2}`);
                    break;
                case 0xb: // Control Change (knobs/faders)
                    console.log(`CC       | Channel: ${channel} | Controller: ${data1} | Value: ${data2}`);
                    break;
                default:
                    console.log(`MIDI Raw | Status: ${status} | Data1: ${data1} | Data2: ${data2}`);
            }
        }

        initMIDI();
    </script>
</body>
</html>
